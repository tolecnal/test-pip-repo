# Lint only: Ruff, isort and pyright, through the same `make lint` used locally.
#
# The devpi smoke suite is deliberately NOT run here -- it needs a reachable devpi
# server and it publishes real releases to an index. Run it by hand from a clone
# (see README: "Testing an upgrade").

name: lint

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Deny by default: this workflow only reads the checkout. A job that needs more has to
# ask for it explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 is the minimum the harness supports, and what pyrightconfig.json
          # type-checks against.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Creates .venvs/lint from requirements-dev.txt, then runs ruff, isort, pyright.
      - name: make lint
        run: make lint

      # A clean checkout has no generated _build_info.py: this proves the package still
      # imports without it and that the CLI wiring is intact.
      - name: Smoke-test the CLI on a clean checkout
        run: |
          ./pipcheck --version
          ./pipcheck list > /dev/null
          ./pipcheck show > /dev/null
