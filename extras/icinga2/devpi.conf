/*
 * Icinga 2 check for devpi-server, using extras/check_devpi.py.
 *
 * Install:
 *   install -m 0755 check_devpi.py /usr/lib/nagios/plugins/check_devpi.py
 *   cp devpi.conf /etc/icinga2/conf.d/devpi.conf    (or into a zone directory)
 *   icinga2 daemon -C && systemctl reload icinga2
 *
 * PluginDir is /usr/lib/nagios/plugins on Debian/Ubuntu and /usr/lib64/nagios/plugins
 * on RHEL; copy the script to whichever your constants.conf names.
 */

object CheckCommand "devpi" {
  command = [ PluginDir + "/check_devpi.py" ]

  arguments = {
    "--url" = {
      value = "$devpi_url$"
      required = true
      description = "devpi-server root URL, e.g. https://devpi.internal:3141"
    }
    "--index" = {
      value = "$devpi_index$"
      description = "Also check that this index exists, e.g. root/pypi"
    }
    "--timeout" = {
      value = "$devpi_timeout$"
      description = "Seconds per HTTP request"
    }
    "--ca-file" = {
      value = "$devpi_ca_file$"
      description = "PEM bundle of CAs to trust, for an internal CA"
    }
    "--insecure" = {
      set_if = "$devpi_insecure$"
      description = "Do not verify the TLS certificate"
    }
    "--user" = {
      value = "$devpi_user$"
      description = "User for HTTP basic auth, if /+status is protected"
    }
    "--password-file" = {
      value = "$devpi_password_file$"
      description = "File holding that user's password, readable by the icinga user"
    }
    "--no-metrics" = {
      set_if = "$devpi_no_metrics$"
      description = "Leave devpi's own metrics out of the perfdata"
    }
    "--time-warn" = "$devpi_time_warn$"
    "--time-crit" = "$devpi_time_crit$"
    "--primary-warn" = "$devpi_primary_warn$"
    "--primary-crit" = "$devpi_primary_crit$"
    "--replica-warn" = "$devpi_replica_warn$"
    "--replica-crit" = "$devpi_replica_crit$"
    "--sync-warn" = "$devpi_sync_warn$"
    "--sync-crit" = "$devpi_sync_crit$"
    "--processing-warn" = "$devpi_processing_warn$"
    "--processing-crit" = "$devpi_processing_crit$"
    "--queue-warn" = "$devpi_queue_warn$"
  }

  vars.devpi_url = "http://$address$:3141"
  vars.devpi_insecure = false
  vars.devpi_no_metrics = false
}

/*
 * Example: one service per host that sets vars.devpi_url.
 *
 *   object Host "devpi.internal" {
 *     address = "devpi.internal"
 *     check_command = "hostalive"
 *     vars.devpi_url = "https://devpi.internal"
 *     vars.devpi_index = "root/pypi"
 *     vars.devpi_ca_file = "/etc/ssl/certs/internal-ca.pem"
 *   }
 */
apply Service "devpi" {
  check_command = "devpi"
  check_interval = 1m
  retry_interval = 30s

  assign where host.vars.devpi_url
}
